name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  core:
    name: Core libraries, server and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore Murmur.slnx
      - name: Format
        run: dotnet format Murmur.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build Murmur.slnx -c Release --no-restore
      - name: Test
        run: dotnet test Murmur.slnx -c Release --no-build --logger "trx" --collect:"XPlat Code Coverage"
      - name: Vulnerable dependencies
        run: |
          dotnet list Murmur.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**"

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"
      - name: Install MAUI workload
        run: dotnet workload install maui-android
      - name: Install Android dependencies
        run: >
          dotnet build src/Murmur.App/Murmur.App.csproj -f net10.0-android
          -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:AcceptAndroidSDKLicenses=True
      - name: Build (Release, no development relay)
        run: dotnet build src/Murmur.App/Murmur.App.csproj -f net10.0-android -c Release -p:AndroidSdkDirectory="$ANDROID_HOME"
      - name: Build debug APK (development relay enabled)
        run: dotnet publish src/Murmur.App/Murmur.App.csproj -f net10.0-android -c Debug -p:AndroidSdkDirectory="$ANDROID_HOME" -o artifacts/apk
      - uses: actions/upload-artifact@v4
        with:
          name: murmur-debug-apk
          path: artifacts/apk/*-Signed.apk

  signaling-image:
    name: Signaling server container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f src/Murmur.Signaling.Server/Dockerfile -t murmur-signaling:ci .
